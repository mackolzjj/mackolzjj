<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="8" viewBox="0 0 1200 8" preserveAspectRatio="none">
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2E97"/>
      <stop offset="35%" stop-color="#B026FF"/>
      <stop offset="70%" stop-color="#7B2FF7"/>
      <stop offset="100%" stop-color="#00F0FF"/>
      <animate attributeName="x1" values="-1;1;-1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="8" fill="url(#holo)" filter="url(#glow)"/>
</svg>
