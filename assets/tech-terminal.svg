<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Fira Code','Cascadia Code',Consolas,'Courier New',monospace">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 窗口 -->
  <rect x="0" y="0" width="720" height="400" fill="#0b0e14"/>
  <rect x="0" y="0" width="720" height="40" fill="#11161f"/>
  <line x1="0" y1="40" x2="720" y2="40" stroke="#1f2630" stroke-width="1"/>

  <!-- 红黄绿圆点 -->
  <circle cx="28" cy="20" r="7" fill="#ff5f56"/>
  <circle cx="52" cy="20" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="20" r="7" fill="#27c93f"/>

  <!-- 标题 -->
  <text x="360" y="25" fill="#8b949e" font-size="13" text-anchor="middle">mackolzjj — tech_stack.sh</text>

  <!-- 提示符 -->
  <text x="28" y="76" fill="#39ff14" font-size="15" filter="url(#glow)">mackolzjj@github:~$ cat tech_stack.md</text>

  <!-- 列表 -->
  <g fill="#39ff14" font-size="16" filter="url(#glow)">
    <text x="40" y="114">▸ OpenWrt</text>
    <text x="40" y="144">▸ LuCI</text>
    <text x="40" y="174">▸ Shell</text>
    <text x="40" y="204">▸ eBPF</text>
    <text x="40" y="234">▸ V2Ray</text>
    <text x="40" y="264">▸ Actions</text>
    <text x="40" y="294">▸ Docker</text>
    <text x="40" y="324">▸ C</text>
  </g>
  <g fill="#5fae7e" font-size="14">
    <text x="210" y="114">路由器固件</text>
    <text x="210" y="144">Web 管理界面</text>
    <text x="210" y="174">自动化脚本</text>
    <text x="210" y="204">内核可编程</text>
    <text x="210" y="234">代理核心</text>
    <text x="210" y="264">CI / CD</text>
    <text x="210" y="294">容器化</text>
    <text x="210" y="324">系统编程</text>
  </g>

  <!-- 闪烁光标 -->
  <text x="28" y="362" fill="#39ff14" font-size="15" filter="url(#glow)">mackolzjj@github:~$</text>
  <text x="200" y="362" fill="#39ff14" font-size="16" filter="url(#glow)">█
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </text>
</svg>
