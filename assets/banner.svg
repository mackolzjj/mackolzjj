<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Fira Code','Cascadia Code',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="55%" stop-color="#140a24"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2E97"/>
      <stop offset="50%" stop-color="#B026FF"/>
      <stop offset="100%" stop-color="#E040FB"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- 辉光 -->
  <ellipse cx="600" cy="160" rx="520" ry="150" fill="url(#glow)"/>

  <!-- 透视网格地面 -->
  <g stroke="#B026FF" stroke-opacity="0.22" stroke-width="1">
    <line x1="0" y1="320" x2="600" y2="190"/>
    <line x1="200" y1="320" x2="600" y2="190"/>
    <line x1="450" y1="320" x2="600" y2="190"/>
    <line x1="750" y1="320" x2="600" y2="190"/>
    <line x1="1000" y1="320" x2="600" y2="190"/>
    <line x1="1200" y1="320" x2="600" y2="190"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="-150" y1="270" x2="1350" y2="270"/>
    <line x1="-50" y1="230" x2="1250" y2="230"/>
    <line x1="120" y1="205" x2="1080" y2="205"/>
  </g>

  <!-- 漂浮粒子 -->
  <g fill="url(#neon)" filter="url(#soft)">
    <circle cx="160" cy="90" r="3"><animate attributeName="cy" values="90;70;90" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="140" r="2.4"><animate attributeName="cy" values="140;120;140" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="80" r="3.2"><animate attributeName="cy" values="80;100;80" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="150" r="2.6"><animate attributeName="cy" values="150;130;150" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="60" r="2"><animate attributeName="cy" values="60;48;60" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="200" r="2.2"><animate attributeName="cy" values="200;184;200" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="210" r="2.8"><animate attributeName="cy" values="210;192;210" dur="5.8s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="60" r="2"><animate attributeName="cy" values="60;46;60" dur="5.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 中部霓虹波形线 -->
  <path d="M0 160 Q150 120 300 160 T600 160 T900 160 T1200 160" fill="none" stroke="url(#neon)" stroke-width="2.5" stroke-opacity="0.85" filter="url(#soft)"/>

  <!-- 标语（无用户名） -->
  <text x="600" y="172" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="4" filter="url(#soft)">NETWORK · FIRMWARE · eBPF</text>
  <text x="600" y="210" text-anchor="middle" fill="#E040FB" font-size="15" letter-spacing="6" opacity="0.9">// building routers &amp; proxies on the kernel edge</text>
</svg>
